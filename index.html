.av{width:104px;height:104px;margin:0 auto 18px;border-radius:50%;background:#0F0F0F;border:1px solid var(--au);display:grid;place-items:center}
.av img{width:62px}
h1{font:600 30px/1.15 'Playfair Display',Georgia,serif;margin:0 0 8px}
.d{color:var(--mut);font-size:14px;margin:0 auto 22px;max-width:36ch}
.so{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:30px}
.so a{color:var(--mut);text-decoration:none;font-size:13px;border:1px solid var(--line);border-radius:999px;padding:6px 14px;transition:border-color .25s,color .25s}
.so a:hover,.so a:focus-visible{border-color:var(--au);color:var(--au)}
.l{display:block;text-decoration:none;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin-bottom:14px;text-align:center;transition:border-color .25s,transform .25s}
.l:hover{border-color:var(--au);transform:translateY(-2px)}
.l:active{transform:scale(.97)}
.l b{display:block;font-size:16px;font-weight:600}
.l small{display:block;color:var(--mut);font-size:13px;margin-top:2px}
.l.p{background:var(--au);border-color:var(--au);color:#0A0A0A;animation:up .8s cubic-bezier(.2,.7,.2,1) .35s both,ring 2.4s ease-out 1.6s infinite}
.l.p small{color:#2a2418}.l.p:hover{animation:none}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(194,169,127,.55)}70%,100%{box-shadow:0 0 0 16px rgba(194,169,127,0)}}
:focus-visible{outline:2px solid var(--au);outline-offset:3px}
footer{color:var(--mut);font-size:13px;margin-top:34px}footer b{color:var(--au);font-weight:500}
main>:nth-child(2){animation-delay:.1s}main>:nth-child(3){animation-delay:.2s}main>:nth-child(4){animation-delay:.28s}main>:nth-child(5){animation-delay:.36s}
.l:nth-of-type(2){animation-delay:.65s}#wb{animation-delay:.45s}#pg{animation-delay:.55s}#sb{animation-delay:.65s}button.l{width:100%;font:inherit;color:var(--tx);cursor:pointer}
.ov{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;justify-content:center;animation:fd .25s both}.ov[hidden]{display:none}
.sheet{width:100%;max-width:520px;max-height:92svh;overflow:auto;background:#0F0F0F;border:1px solid var(--au);border-bottom:0;border-radius:22px 22px 0 0;padding:24px 22px calc(26px + env(safe-area-inset-bottom,0px));text-align:left;animation:sl .38s cubic-bezier(.2,.8,.2,1) both}
@keyframes fd{from{opacity:0}}@keyframes sl{from{transform:translateY(60px);opacity:0}}
.x{float:right;background:none;border:1px solid var(--line);border-radius:50%;width:38px;height:38px;font-size:18px;color:var(--tx);cursor:pointer}
.sheet h2{font:600 28px/1.15 'Playfair Display',serif;margin:6px 0 4px}.sheet h3{font:600 20px 'Playfair Display',serif;color:var(--au);margin:24px 0 4px}.sheet .d2{color:var(--mut);font-size:14px;margin:0}
.r{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px;color:var(--mut)}.r b{display:block;color:var(--tx);font-size:15px;font-weight:500;word-break:break-all}
.c{flex:none;background:none;border:1px solid var(--au);color:var(--au);border-radius:999px;padding:6px 14px;font:500 13px Montserrat,sans-serif;cursor:pointer;transition:background .2s,color .2s}.c.ok{background:var(--au);color:#0A0A0A}
.nt{margin-top:22px;border-left:2px solid var(--au);padding-left:14px;font-size:14px;color:var(--mut)}.nt b{color:var(--tx)}
.acts{display:grid;gap:10px;margin-top:20px}.acts .btn{display:block;text-align:center;background:var(--au);color:#0A0A0A;border-radius:999px;padding:14px;font-weight:600;text-decoration:none;font-size:15px}.acts .btn.o{background:none;color:var(--tx);border:1px solid var(--au)}.acts .btn:active{transform:scale(.97)}
.in{width:100%;background:#0A0A0A;border:1px solid var(--line);border-radius:12px;padding:13px 14px;color:var(--tx);font:500 16px Montserrat,sans-serif;margin-top:6px}.in:focus{border-color:var(--au);outline:none}.er{color:#e7a0a0;font-size:13px;min-height:18px;margin:8px 0 0}
.opt{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:12px;transition:border-color .25s,transform .25s}.opt:hover{border-color:var(--au)}.opt:active{transform:scale(.98)}.opt img{width:48px;height:48px;object-fit:contain;flex:none}.opt b{display:block;font-size:16px}.opt span{font-size:13px;color:var(--mut)}
.sheet button.btn{display:block;width:100%;border:0;border-radius:999px;padding:14px;background:var(--au);color:#0A0A0A;font:600 15px Montserrat,sans-serif;cursor:pointer;margin-top:10px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
